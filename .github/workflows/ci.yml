name: CI

# What runs, and when. The gate has to be strict enough that `main` is always
# releasable and cheap enough that a typo fix does not cost fifteen jobs.
#
# So the matrix is chosen per event rather than fixed:
#
#   pull request   lint, four test legs, open-core          ~2 min
#   release        lint, all nine test legs, golden, open-core, via
#                  workflow_call from release.yml
#
# A pull request that touches only prose runs nothing but the aggregate check.
# Label a PR `ci:full` to get the whole gate before merging, which is worth
# doing for anything touching engines or packaging.
#
# No `push: branches: [main]` trigger. Branch protection requires this
# workflow's own `CI` check to pass before a pull request can merge, so
# every commit that lands on `main` was already run through the gate above —
# rerunning the identical tree state a second time the moment it lands would
# just be the same answer twice. release.yml's `workflow_call` still reruns
# the full gate a final time immediately before publishing (see its own
# comment for why that one stays), so a typo still cannot reach PyPI even if
# someone bypasses the branch protection.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # --------------------------------------------------------------------------
  # Decide what this event deserves. Everything below is gated on these outputs,
  # rather than on `paths-ignore` at the trigger — a workflow skipped by a path
  # filter never reports its required check, so the pull request waits forever
  # for a status that will not arrive.
  # --------------------------------------------------------------------------
  scope:
    name: what needs to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      golden: ${{ steps.decide.outputs.golden }}
      matrix: ${{ steps.decide.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          full_label="${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}"

          # --- did any code change? -------------------------------------
          # Only a pull request has a base to diff against. Everywhere else,
          # assume yes: guessing wrong on `main` is how a release breaks.
          code=true
          if [ "$event" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            merge_base=$(git merge-base FETCH_HEAD HEAD)
            changed=$(git diff --name-only "$merge_base" HEAD)
            echo "changed files:"; printf '%s\n' "$changed"

            # grep -qv succeeds when *some* line is not prose. Negate it: every
            # changed path is documentation, so no test can tell us anything.
            if [ -n "$changed" ] && \
               ! printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$|^LICENSE$|^\.gitignore$)'; then
              code=false
            fi
          fi

          # --- the expensive half ---------------------------------------
          # Golden tests install Ghostscript, Tesseract, Pandoc and Poppler on
          # three operating systems. That is minutes of package manager, and it
          # cannot tell you anything a pull request has broken until the pull
          # request has actually touched an engine.
          #
          # `[ x ] && y` would be wrong here: under `set -e` a false test is a
          # failing command and aborts the step. Every branch is an `if`.
          golden=false
          case "$event" in
            release|workflow_dispatch)
              golden=true
              ;;
            pull_request)
              if [ "$full_label" = "true" ]; then golden=true; fi
              ;;
          esac
          if [ "$code" = "false" ]; then golden=false; fi

          # --- the test matrix ------------------------------------------
          # A pull request gets every operating system and both ends of the
          # supported Python range: four legs instead of nine, and nothing that
          # has ever caught a bug here is lost. The full cross product runs
          # before a release, where it is worth the wait.
          if [ "$event" = "pull_request" ] && [ "$full_label" != "true" ]; then
            matrix='{"include":[
              {"os":"ubuntu-latest","python":"3.11"},
              {"os":"ubuntu-latest","python":"3.13"},
              {"os":"macos-latest","python":"3.12"},
              {"os":"windows-latest","python":"3.12"}]}'
          else
            matrix='{"os":["ubuntu-latest","macos-latest","windows-latest"],
                     "python":["3.11","3.12","3.13"]}'
          fi

          {
            echo "code=$code"
            echo "golden=$golden"
            echo "matrix=$(printf '%s' "$matrix" | tr -d '\n ')"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::code=$code golden=$golden event=$event"

  # --------------------------------------------------------------------------
  # Static gates. Fast, single-platform, fails the PR before burning the matrix.
  # --------------------------------------------------------------------------
  lint:
    name: lint & types
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # mypy checks src/, tests/ and benchmarks/ as one run (see [tool.mypy]
      # `files` in pyproject.toml), and that tree imports PIL, textual and cv2
      # behind the `images`, `tui` and `ocr` extras. `[dev]` alone leaves those
      # unresolved, which strict mode reports as real errors, not warnings.
      - run: python -m pip install -e ".[dev,tui,ocr,images]"

      - name: ruff (lint)
        run: ruff check --output-format=github .

      - name: ruff (format)
        run: ruff format --check .

      - name: mypy (strict)
        run: mypy

      - name: import-linter (architectural layering)
        run: lint-imports

  # --------------------------------------------------------------------------
  # The structural guarantees from docs/architecture/overview.md. These are the
  # tests that make v2's failure modes unreintroducible, so they run everywhere.
  # --------------------------------------------------------------------------
  test:
    name: test ${{ matrix.os }} / py${{ matrix.python }}
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # `tui` since M7 and `ocr` since M8, as well as `dev`. Without them the
      # TUI tests and the deskew regression skip on all nine cells, and
      # `test_no_heavy_imports.py`'s `textual` and `cv2` guards pass vacuously
      # because the packages are simply absent. `ocr` matters most: the deskew
      # test is the one v2's defect needed and it requires no binary, only
      # OpenCV. The open-core job below deliberately stays on `[dev]` alone,
      # which is what exercises the other path — that a machine without them
      # still gets a typed error rather than an ImportError.
      - run: python -m pip install -e ".[dev,tui,ocr]"

      # No external binaries needed — these must pass on a bare machine, which
      # is the whole point of the light base install.
      - name: unit, hygiene & property tests
        run: pytest -m "not golden and not needs_binary" --cov --cov-report=term-missing

  # --------------------------------------------------------------------------
  # Golden tests need the real external tools. Skipped locally when a binary is
  # absent; REQUIRED here, so the badge means something.
  #
  # This is the slow half of the gate, and it has already cost a run: an
  # `apt-get update` hung for twelve and a half minutes with no timeout to stop
  # it, because a job with no `timeout-minutes` is allowed to run for six hours.
  # Every job below has a limit, and this step retries rather than hanging.
  # --------------------------------------------------------------------------
  golden:
    name: golden ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.golden == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: external tools (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update failed (attempt $attempt), retrying"
            sleep 5
          done
          sudo apt-get install -y --no-install-recommends \
            ghostscript tesseract-ocr tesseract-ocr-deu poppler-utils pandoc

      - name: external tools (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install ghostscript tesseract poppler pandoc

      - name: external tools (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: choco install --no-progress -y ghostscript tesseract pandoc poppler

      - run: python -m pip install -e ".[dev,all]"

      - name: verify the tools are actually visible
        run: docmax doctor

      - name: golden tests
        # No golden fixture corpus exists yet at this milestone, so pytest's
        # exit 5 ("no tests collected") is expected, not a failure — the day
        # golden tests land, any *other* exit code still fails the job.
        # `cmd || status=$?` (not a bare command, and not `if !cmd`, which
        # collapses the real exit code to 0/1) keeps bash's default -e from
        # aborting the step while still capturing the actual exit code.
        shell: bash
        run: |
          status=0
          pytest -m "golden or needs_binary" -ra || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            exit "$status"
          fi

  # --------------------------------------------------------------------------
  # The open-core boundary. The freely-licensed half must never quietly grow a
  # dependency on the gated half — so we delete pro/ and require a green suite.
  # See docs/adr/0004-open-core-boundary.md
  # --------------------------------------------------------------------------
  open-core:
    name: open core stands alone
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: remove the licence-gated half
        run: rm -rf src/docmax/pro

      - run: python -m pip install -e ".[dev]"

      - run: pytest -m "not golden and not needs_binary"

  # A single required status check, so branch protection needs one entry
  # instead of nine that change every time the matrix does.
  #
  # `skipped` counts as passing. That is what lets a docs-only pull request go
  # green without running the suite, and it is safe because the decision to skip
  # is made by `scope` above and visible in its log — not by a silent path
  # filter that suppresses the whole workflow.
  ci-ok:
    name: CI
    if: always()
    needs: [scope, lint, test, golden, open-core]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: verify nothing failed
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for job in \
            "scope=${{ needs.scope.result }}" \
            "lint=${{ needs.lint.result }}" \
            "test=${{ needs.test.result }}" \
            "golden=${{ needs.golden.result }}" \
            "open-core=${{ needs.open-core.result }}"
          do
            name=${job%%=*}
            result=${job#*=}
            echo "$name: $result"
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
